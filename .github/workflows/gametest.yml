# Game tests: a real dedicated server, a real world, spawned mobs, the real damage pipeline.
#
# This is the counterpart to `build.yml`:
#   build.yml   -> static packaging gate (`runTest`) on every push / PR      ~3 min
#   gametest.yml-> real game logic (`runGametest`) on a schedule / on demand ~5-8 min
#
# It is deliberately NOT triggered by push or pull_request: it needs a world, a server tick loop and
# the Minecraft EULA, it is slower and flakier than a build, and a red game test should never block a
# docs commit. Run it manually from the Actions tab ("Run workflow") whenever damage/level/enchant
# behaviour changed.
#
# ⚠️ EULA: the step below writes `eula=true` into the throwaway runner's `run-gametest/eula.txt`.
# That is the project owner's decision to accept Mojang's EULA **for this ephemeral CI machine**; it
# does not touch anyone's local `run/eula.txt`.

name: gametest

on:
  schedule:
    # Weekly safety net: Mondays 03:00 UTC (= 11:00 Asia/Shanghai).
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: gametest
  cancel-in-progress: false

jobs:
  gametest:
    name: Fabric GameTest (real game logic)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Which commit is actually under test. A manual dispatch runs the **ref it was started from**,
      # so a run can easily be one or two commits behind the fix being verified — that happened once
      # (a run from 87ee44d reported "3 required tests failed" while the fix was already pushed) and
      # cost a whole round trip. These two lines make the answer obvious in the log.
      - name: Show the commit under test
        run: |
          echo "github.sha : $GITHUB_SHA"
          echo "github.ref : $GITHUB_REF"
          git log -1 --format='checked out: %h %s'
          echo "mod_version: $(grep '^mod_version' gradle.properties)"
          echo "game tests : $(grep -c '@GameTest' src/main/java/dev/firefly/simpletweaks/gametest/SimpleTweaksGameTests.java)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Same reason as build.yml: the committed distributionUrl is a China-only mirror that a
      # GitHub runner cannot reach. Only the host is swapped.
      - name: Point the wrapper at the official Gradle distribution
        run: |
          sed -i -E 's#^distributionUrl=https\\://mirrors\.cloud\.tencent\.com/gradle/#distributionUrl=https\\://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      # The dev server refuses to start before the EULA is accepted. CI-only, throwaway directory.
      - name: Accept the Minecraft EULA for this runner
        run: |
          mkdir -p run-gametest
          echo "eula=true" > run-gametest/eula.txt

      # `runGametest` is the Loom run configuration defined in build.gradle. It is NOT part of
      # `build`, so this is the only place it runs.
      - name: Run game tests
        run: ./gradlew runGametest --console=plain --stacktrace

      # Fabric reports a failed assertion to the console as the generic "Failed to invoke test
      # method", so the reason only exists in the JUnit XML (and in our own [FST-GameTest] log lines).
      # Print both, always, so a red run explains itself in the log instead of requiring a download.
      - name: Show game test failures
        if: always()
        run: |
          report=build/gametest-junit.xml
          if [ -f "$report" ]; then
            echo '--- failure messages ---'
            grep -o 'message="[^"]*"' "$report" || true
            echo '--- test cases ---'
            grep -o '<testcase[^>]*name="[^"]*"[^>]*>' "$report" || true
          else
            echo "no $report was produced"
          fi
          echo '--- [FST-GameTest] lines from the server log ---'
          grep -F '[FST-GameTest]' run-gametest/logs/latest.log || echo '(none)'

      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            build/gametest-junit.xml
            run-gametest/logs/latest.log
          if-no-files-found: warn
          retention-days: 30

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo '--- environment ---'
          uname -a || true
          java -version 2>&1 || true
          echo '--- test report ---'
          ls -l build/gametest-junit.xml 2>/dev/null || echo 'no junit xml produced'
          echo '--- server log tail ---'
          tail -n 120 run-gametest/logs/latest.log 2>/dev/null || true
