# Builds the mod on every push and pull request, and runs the same gate a local build runs.
#
# `./gradlew build` depends on `:runTest` (see gradle/post-build-tests.gradle), so this file
# deliberately does NOT list the individual checks: one command is the single source of truth for
# "what a valid build is", and it stays honest because a local build fails exactly the same way.
#
# Nothing here needs a Minecraft account or a launcher: the mod is compiled and the jar is inspected.
#
# ⚠️ History worth keeping, because both bugs below were invisible on Windows and cost a red run each:
#
#   1. `gradlew` (the shell script) had `commands -v xargs` instead of `command -v xargs`, so it
#      died with "xargs is not available" before starting Java. Windows never runs that script
#      (`gradlew.bat` is used instead), so it went unnoticed. The wrapper is now regenerated from a
#      pristine Gradle 8.11.1 distribution (`gradle wrapper --gradle-version 8.11.1 ...`), and the
#      `./gradlew --version` step below exists to fail loudly if it ever regresses.
#   2. The committed `distributionUrl` is a China-only mirror (mirrors.cloud.tencent.com), which a
#      GitHub runner cannot reach. Only the host is rewritten to services.gradle.org; the version
#      stays in gradle-wrapper.properties so CI cannot drift from what a developer runs.

name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch cancels the older run: its jar is already obsolete, and a queue of
# superseded builds is the usual reason CI feels slower than building locally.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 21 / Gradle build + runTest
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches the Gradle user home: the wrapper's downloaded distribution AND Loom's Minecraft /
      # mappings cache both live there, which is what makes the second run fast.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `gradlew` is committed with the executable bit; this is only a guard for checkouts that lost it.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Only the host is swapped, so gradle-wrapper.properties stays the single source of the version
      # and this step becomes a no-op the day the committed URL points at the official distribution.
      - name: Point the wrapper at the official Gradle distribution
        run: |
          sed -i -E 's#^distributionUrl=https\\://mirrors\.cloud\.tencent\.com/gradle/#distributionUrl=https\\://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      # Fails here - not several steps later - if the shell wrapper itself is broken.
      - name: Wrapper smoke test
        run: ./gradlew --version

      - name: Build (includes :runTest)
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: simple_tweaks-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      # On failure, print in one screen everything that usually answers "why", so the log is
      # diagnosable without another round trip.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo '--- environment ---'
          uname -a || true
          java -version 2>&1 || true
          echo '--- wrapper ---'
          ls -l gradlew gradle/wrapper/ || true
          cat gradle/wrapper/gradle-wrapper.properties || true
          head -5 gradlew || true
          echo '--- build outputs ---'
          ls -l build/libs 2>/dev/null || true
