name: Release

# Two ways in, both keyed on the same tag:
#   * pushing a tag from the shell
#   * clicking "Publish release" in the GitHub UI (a tag created there does not emit a push event)
# A normal push to a branch still never publishes anything.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mc-publish silently skips a target whose credentials are empty, so a missing variable or
      # secret only shows up as "no CurseForge upload" much later. Fail here instead, before the
      # five minute build.
      - name: Check CurseForge credentials
        env:
          CF_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          missing=0
          [ -n "$CF_ID" ] || { echo "::error::repository variable CURSEFORGE_PROJECT_ID is not set"; missing=1; }
          [ -n "$CF_TOKEN" ] || { echo "::error::repository secret CURSEFORGE_TOKEN is not set"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "Settings -> Secrets and variables -> Actions; see AGENTS.md section 1"; exit 1; }
          echo "CurseForge target: project $CF_ID"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: mod
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building simple_tweaks-$version"

      - name: Build
        run: ./gradlew build --console=plain

      # The artifact is the remapped jar; build/devlibs must never be published because its
      # mixins carry no refmap and every installation would fail with "target not found".
      - name: Collect the release jar
        run: |
          test -f "build/libs/simple_tweaks-${{ steps.mod.outputs.version }}.jar" || {
            echo "expected build/libs/simple_tweaks-${{ steps.mod.outputs.version }}.jar"; ls build/libs; exit 1; }

      # Three sources, first hit wins:
      #   1. the notes typed on the GitHub release (mc-publish rewrites the body from this file,
      #      so reading them back first keeps whatever was written by hand intact)
      #   2. the English player-facing section of CHANGELOG.md for this version
      #   3. the Chinese engineering entry in DEVLOG.md
      - name: Extract the changelog entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.mod.outputs.version }}"
          gh release view "${{ github.ref_name }}" --json body -q .body > .notes.md 2>/dev/null || true
          if [ -s .notes.md ]; then
            source="release notes"
            cp .notes.md CHANGELOG.md
          else
            awk -v v="$v" '
              /^## / { if (found) exit; if (index($0, "[" v "]")) found = 1 }
              found { print }
            ' CHANGELOG.md > .notes.md
            if [ -s .notes.md ]; then
              source="CHANGELOG.md"
              cp .notes.md CHANGELOG.md
            else
              awk -v v="$v" '
                /^## / { if (found) exit; if (index($0, v)) found = 1 }
                found { print }
              ' DEVLOG.md > CHANGELOG.md
              source="DEVLOG.md"
            fi
          fi
          echo "changelog source: $source"
          if [ ! -s CHANGELOG.md ]; then
            echo "FireFly's Simple Tweaks $v for Fabric 1.21.1" > CHANGELOG.md
            echo "changelog source: fallback title"
          fi
          head -n 20 CHANGELOG.md

      - name: Publish to CurseForge and GitHub Releases
        uses: Kir-Antipov/mc-publish@v3
        with:
          # Repository variable (Settings -> Secrets and variables -> Actions -> Variables).
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          # Repository secret holding the CurseForge API token.
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-name: FireFly's Simple Tweaks ${{ steps.mod.outputs.version }} for Fabric 1.21.1

          files: build/libs/simple_tweaks-${{ steps.mod.outputs.version }}.jar
          name: FireFly's Simple Tweaks ${{ steps.mod.outputs.version }} for Fabric 1.21.1
          version: ${{ steps.mod.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md

          game-versions: 1.21.1
          loaders: fabric
          java: 21
