# The mirror below is reachable from China and is what local builds use. It is NOT reachable from
# GitHub-hosted runners, so .github/workflows/build.yml rewrites the host to services.gradle.org
# before building (only the host; the version below stays the single source of truth).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
