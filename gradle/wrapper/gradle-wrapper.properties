# The mirror below is reachable from China and is what local builds use. It is NOT reachable from
# GitHub-hosted runners (CI run #1 died in ~21s on networkTimeout=10000, before any Gradle task ran),
# so .github/workflows/build.yml rewrites the host to services.gradle.org before building.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
