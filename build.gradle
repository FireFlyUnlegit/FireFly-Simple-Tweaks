plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    // KSP: generates the enchantment datapack JSON + GeneratedEnchantments.kt from @ModEnchantment.
    id 'com.google.devtools.ksp' version "${ksp_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Kotlin support for Fabric. Ships the Kotlin stdlib so we do NOT shade it ourselves
    // (the old 1.12.2 build shaded kotlin-stdlib into the jar; Fabric does it via this mod).
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // ---- KSP ---------------------------------------------------------------------------------
    // The processor is a build-only Kotlin/JVM library (`ksp-processor/`). It is on the `ksp`
    // configuration, so neither it nor the KSP API ever reaches the mod jar or `modRuntimeOnly`.
    //
    // It reads @ModEnchantment (matched by fully-qualified name) and writes:
    //   build/generated/ksp/main/kotlin    -> GeneratedEnchantments.kt
    //   build/generated/ksp/main/resources -> data/simple_tweaks/enchantment/<id>.json
    //                                      -> data/minecraft/tags/enchantment/{non_treasure,
    //                                         in_enchanting_table,tradeable}.json
    // KSP registers both output directories on the `main` source set itself, which is why the datapack
    // JSON lands in the jar with no extra `sourceSets` wiring here.
    ksp project(':ksp-processor')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

kotlin {
    jvmToolchain(21)
}

// Game tests: a real server + world, spawned entities, the real damage pipeline.
//
// Deliberately a SEPARATE run configuration, and NOT wired into `build` or `check`:
//   * it needs a world and a server tick loop (seconds to minutes, not milliseconds);
//   * it needs the Minecraft EULA accepted for the run directory (`run-gametest/eula.txt`);
//   * it is the author's acceptance, not a per-commit gate.
// Run it with `gradlew runGametest` (or the scheduled `gametest` GitHub workflow).
// The static packaging gate that DOES run on every build is `runTest`
// (`gradle/post-build-tests.gradle`).
loom {
    runs {
        gametest {
            server()
            name = 'Game Test'
            runDir = 'run-gametest'
            vmArg '-Dfabric-api.gametest=true'
            // JUnit-style XML so CI can publish results instead of grepping a console log.
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-junit.xml"
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// runTest: post-build verification of the remapped jar. `build` depends on it, so a jar that fails
// any check cannot be produced by a successful `gradlew build`. See the script's header for the list
// of invariants and why each one exists.
apply from: "$rootDir/gradle/post-build-tests.gradle"
