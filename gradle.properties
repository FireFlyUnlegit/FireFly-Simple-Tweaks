# ---- Gradle ----------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ---- Fabric toolchain ------------------------------------------------------
# All four coordinates below were verified against maven.fabricmc.net/maven-metadata.xml.
# yarn 1.21.1+build.3 was additionally confirmed present in the local Loom cache.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
loom_version=1.9-SNAPSHOT
# 0.116.17+1.21.1 is the last Fabric API release published for the 1.21.1 line.
fabric_version=0.116.17+1.21.1

# ---- Kotlin ----------------------------------------------------------------
# fabric-language-kotlin is MC-version independent (it is a language adapter), so the version is
# chosen to match kotlin_version, NOT minecraft_version.
# Verified against https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin/maven-metadata.xml
#   DO NOT use 1.12.1+kotlin.2.0.21 -- that coordinate does not exist.
#   1.12.1 / 1.12.2 ship kotlin.2.0.20 ; 1.12.3 is the first release on kotlin.2.0.21.
kotlin_version=2.0.21
fabric_kotlin_version=1.12.3+kotlin.2.0.21

# ---- KSP -------------------------------------------------------------------
# KSP versions are "<kotlin>-<ksp>" and MUST match kotlin_version exactly: 2.0.21-1.0.28 is the last
# KSP release for Kotlin 2.0.21 (verified against
# https://repo1.maven.org/maven2/com/google/devtools/ksp/symbol-processing-api/maven-metadata.xml).
ksp_version=2.0.21-1.0.28

# ---- Mod -------------------------------------------------------------------
mod_version=2.1.0
maven_group=dev.firefly
archives_base_name=simple_tweaks
