# Gradle Properties
org.gradle.jvmargs = -Xmx3G
org.gradle.java.installations.auto-detect=true

# Source Options
use_modern_java_syntax = false
use_jetbrains_annotations = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Mod Information
mod_version = 1.0.2
root_package = dev.firefly.simplemod
mod_id = simplemod
mod_name = Simple Optimization Mod

# Mod Metadata (Optional)
mod_description = Remove damage indicator particles to prevent lag.
mod_url =
mod_update_json =
mod_authors = FireFly
mod_credits =
mod_logo_path =

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Publishing
release_type = release
publish_with_changelog = ${{ it.file('CHANGELOG.md').exists() }}
client_side = true
server_side = true

# CurseForge / Modrinth
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
use_mixins = true
mixin_booter_version = 11.13
generate_mixins_json = false
mixin_configs = mixins.${mod_id}.json
mixin_connector_class =
mixin_refmap = mixins.${mod_id}.refmap.json

# Coremods
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5