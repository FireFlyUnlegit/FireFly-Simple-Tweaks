plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    // Modrinth's maven, used for the dev-only Carpet dependency below.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Kotlin support for Fabric. Ships the Kotlin stdlib so we do NOT shade it ourselves
    // (the old 1.12.2 build shaded kotlin-stdlib into the jar; Fabric does it via this mod).
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

    // ---- dev-only ---------------------------------------------------------------
    // Fabric Carpet supplies the `/player <name> ...` command (fake players), so handler
    // behaviour can be driven and observed on a DEDICATED SERVER without launching a client.
    // modRuntimeOnly => it is on the dev runtime classpath only and is NEVER shipped in the jar.
    //
    // Carpet 1.4.147 is the only release that supports MC 1.21.1 (confirmed against the Modrinth
    // API: /v2/project/carpet/version?game_versions=["1.21.1"] returns exactly one entry; later
    // Carpet releases target 1.21.2+). It is resolved from Modrinth's maven (api.modrinth.com/maven).
    modRuntimeOnly 'maven.modrinth:carpet:1.4.147'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

kotlin {
    jvmToolchain(21)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
